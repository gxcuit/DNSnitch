# AC4：clash-verge 默认 DNS 覆写（nameserver 含裸 8.8.8.8），规则本身没有问题。
mixed-port: 7897
proxies:
  - name: node
    type: vmess
    server: node.example.com
    port: 443
    uuid: 00000000-0000-0000-0000-000000000000
    alterId: 0
    cipher: auto
proxy-groups:
  - name: PROXY
    type: select
    proxies: [node]

dns:
  enable: true
  enhanced-mode: 'fake-ip'
  nameserver:
    - '8.8.8.8'
    - 'https://doh.pub/dns-query'
    - 'https://dns.alidns.com/dns-query'

rules:
  - GEOSITE,private,DIRECT
  - GEOIP,lan,DIRECT,no-resolve
  - GEOSITE,cn,DIRECT
  - GEOSITE,geolocation-!cn,PROXY
  - MATCH,PROXY
